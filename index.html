<title>Rando Hub has moved</title>
<script>
  // Rando Hub's old addresses (hugecrankhank.github.io/Rando-hub/… and /Rando-hub-Beta/…) → the
  // licensed sites, the same page (and seed link) there. Without a license that page is the
  // lock page: paste a key, or ask Hank for one.
  (function () {
    var p = location.pathname, m = p.match(/^\/rando-hub(-beta)?(\/.*)?$/i);
    var site = m && m[1] ? 'https://rando-hub-beta.pages.dev' : 'https://rando-hub.pages.dev';
    var rest = m ? (m[2] || '/') : '/';
    location.replace(site + rest + location.search + location.hash);
  })();
</script>

</main>
